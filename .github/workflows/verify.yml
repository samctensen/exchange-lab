name: Java verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify tests, packaging, and formatting
        run: mvn --batch-mode --no-transfer-progress clean install
      - name: Verify the JMH benchmark module
        run: mvn --batch-mode --no-transfer-progress -f benchmarks/pom.xml clean verify
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            benchmarks/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
